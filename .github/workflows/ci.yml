name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile application and tests
        run: python -m compileall -q server.py test_server.py tests
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Run unit and end-to-end tests
        run: |
          mkdir -p test-results/e2e
          pytest -q --junitxml=test-results/e2e/pytest.xml
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: test-results/e2e/pytest.xml
          if-no-files-found: warn
