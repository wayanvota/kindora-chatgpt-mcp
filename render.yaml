# Render.com blueprint.
# Easiest: click the "Deploy to Render" button in the README. Or manually:
#   New + -> Blueprint -> pick this repo.
# After it goes live, your MCP URL is https://<service>.onrender.com/mcp
#
# Notes:
#   - No health check path is set on purpose: an MCP endpoint does not return a
#     plain 2xx to a GET probe, so Render's port-open detection is used instead.
#   - PORT is intentionally NOT pinned. Render injects its own $PORT and the
#     server binds it automatically.
services:
  - type: web
    name: kindora-chatgpt-mcp
    runtime: docker
    plan: free
    envVars:
      - key: TRANSPORT
        value: http
      - key: HOST
        value: 0.0.0.0
      - key: MCP_PATH
        value: /mcp
      - key: KINDORA_MCP_URL
        value: https://kindora-mcp.azurewebsites.net/mcp/
